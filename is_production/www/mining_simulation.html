      rampFillDaily: cut(rampFillDaily), rampFromWaste: cut(rampFromWaste), rampOwed: rampNeed, rampCoalT: cut(rampCoalT), rampTDaily: cut(rampTDaily),
      rampToe: roads.follows.map(R => ({ id: R.road.id, g: R.g, log: R.log })),
      sterile: keepLoss, sterileBlock: Array.from(sterile, Boolean),
      limit: DL.any ? Array.from(lim) : null, limitZone: DL.any ? Array.from(DL.zone) : null, limitCut: DL.any ? Array.from(DL.cut) : null, below,
      // seam cut-off as it was for this run. Per seam: vol, t = thin coal in the ground; mVol, mT = the part this schedule mines
      // as waste; left, leftT = the part that stays in the ground where a block stops higher up. Per block: vol (in the ground) and mined (as waste).
      cut: CUT ? { by: CUT.by, stop: !!(P.cutoff && P.cutoff.stop), layers: cutSum, vol: CUT.vol, mined: cutMined, thick: CUT.thick } : null,
      recv: acts.filter(X => X.voidMode).map(X => ({ act: X.a.id, map: Array.from(X.recv.entries()) })),
      ramps: roads.ramps.map(R => ({ id: R.road.id, cells: R.cells.length })),

  // ---------------- playback ----------------
  function playback(ws, res) {
    const pb = { insitu: Float32Array.from(ws.topo), fill: new Float32Array(ws.n), day: -1 };

})();

/* ===== Monthly figures of a schedule: tonnes and bcm mined, ADC tonnes and other block attributes, typed-in targets ===== */
const Monthly = (() => {
  const AVG_MONTH = 365.25 / 12; // days in an average month

  // ---------- block attributes in the monthly summary ----------
  /* P.attrReport[column] = {mode, layer} holds what the user chose; everything else is worked out from the column name.
     mode: 'adc' ADC tonnes of the block (a total, shown with the coal) · 'sum' another total of the block ·
           'avg' a value averaged over what is mined (weighted by tonnes) · '' not reported
     layer: a layer id, 'coal' (all seams together) or 'block' (the whole block) */
  const tok = '(^|[^a-z0-9])', end = '([^a-z0-9]|$)';
  function numericColumns(P) {
    return (P.attrColumns || []).filter(c => c !== P.idColumn && P.blocks.some(b => b.attrs && b.attrs[c] !== '' && b.attrs[c] != null && isFinite(parseFloat(b.attrs[c]))));
  }
  function autoLayer(P, col) {
    const n = String(col);
    for (const L of P.layers) if (L.type === 'coal') {
      if (L.densityField === col || (L.qualityFields || []).includes(col)) return L.id;
      // the seam's short name: "Seam 4" -> 4, "Seam 2U" -> 2U; else from its roof surface ("S4_ROOF" -> 4)
      const t = Model.seamToken(L.name) || Model.seamToken(((P.surfaces || []).find(x => x.id === L.top) || {}).name);
      if (t && new RegExp(`${tok}(s|sm|seam)[ _-]?${t}${end}`, 'i').test(n.replace(/_/g, ' '))) return L.id;
    }
    const first = t => (P.layers.find(L => L.type === t) || {}).id || null;
    const s = n.replace(/_/g, ' ');
    if (new RegExp(`${tok}(ob|ovb|overburden)${end}`, 'i').test(s)) return first('overburden');
    if (new RegExp(`${tok}(ib|interburden|parting)${end}`, 'i').test(s)) return first('interburden');
    if (/soil/i.test(s)) return first('topsoil');
    return null;
  }
  function autoMode(P, col) {
    const s = String(col).replace(/_/g, ' ');
    if (new RegExp(`${tok}adc${end}`, 'i').test(s) || /adc\s*(t|ton)/i.test(s)) return 'adc';
    if (P.layers.some(L => (L.qualityFields || []).includes(col) || L.densityField === col)) return 'avg';
    if (new RegExp(`^\\s*(strip|block|cut|row|panel|pit|bench|seq|sequence|no|nr|num|number|id|name|x|y|z|e|n|east|easting|north|northing|lat|latitude|lon|long|longitude)\\s*$`, 'i').test(s) || new RegExp(`${tok}(id|no|nr)\\s*$`, 'i').test(s)) return '';
    if (new RegExp(`${tok}(t|kt|mt|ton|tons|tonne|tonnes|tonnage)${end}`, 'i').test(s)) return ''; // other tonnages are left out: only ADC tonnes and the schedule's own tonnes are reported
    if (new RegExp(`${tok}(bcm|kbcm|m3|m2|ha|area|volume)${end}`, 'i').test(s)) return 'sum';
    return 'avg';
  }
  function attrPlan(P) {
    const R = P.attrReport || {}, ids = new Set(P.layers.map(L => L.id));
    return numericColumns(P).map(col => {
      const u = R[col] || {}, mode = u.mode != null ? u.mode : autoMode(P, col);
      let layer = u.layer != null && (ids.has(u.layer) || u.layer === 'coal' || u.layer === 'block') ? u.layer : autoLayer(P, col);
      if (!layer) layer = mode === 'adc' ? 'coal' : 'block';
      return { col, mode, layer, auto: u.mode == null && u.layer == null };
    });
  }
  function layerLabel(P, layer) { return layer === 'coal' ? 'All seams' : layer === 'block' ? 'Whole block' : (P.layers.find(L => L.id === layer) || { name: '?' }).name; }

  // ---------- targets ----------
  /* P.targets = {coal, waste: what the user types for an average month; wasteUnit: 'bcm' | 't'; basis: 'calendar' | 'working'}.
     Each month's target follows its number of days: target × days of the month ÷ days in an average month. */
  function workDaysPerMonth(P, y0, y1) { // working days in an average month: the share of days worked over whole calendar years × 30.44
    let n = 0, all = 0;
    for (let d = new Date(Date.UTC(y0, 0, 1)); d.getUTCFullYear() <= y1; d = new Date(d.getTime() + U.DAY_MS)) { all++; if (Sim.isWorking(P.calendar, d)) n++; }
    return (n / all) * AVG_MONTH;
  }

  /* Days in an average month on the basis the targets follow: 30.44 calendar days, or the working days in an average
     month (from the calendar over the four years from the start date, so it does not depend on how long the schedule runs). */
  function daysPerMonth(P) {
    if (!(P.targets && P.targets.basis === 'working')) return AVG_MONTH;
    const y0 = U.parseISO(P.startDate).getUTCFullYear();
    return workDaysPerMonth(P, y0, y0 + 3) || AVG_MONTH;
  }

  // ---------- the monthly figures ----------
  function build(P, ws, res) {
    const iso = P.startDate, L = P.layers, nL = L.length, nD = res.nDays;
    const key = d => { const t = U.dayDate(iso, d); return t.getUTCFullYear() * 12 + t.getUTCMonth(); };
    const k0 = key(0), nM = key(nD - 1) - k0 + 1;
    const mOf = new Int32Array(nD), days = new Float64Array(nM), work = new Float64Array(nM);
    for (let d = 0; d < nD; d++) { const m = (mOf[d] = key(d) - k0); days[m]++; if (res.working[d]) work[m]++; }
    const sum = a => { let s = 0; for (const v of a) s += v; return s; };
    const mk = () => new Float64Array(nM);
    const isCoal = A => L[A.layer].type === 'coal';
    const acts = res.acts.map(A => { const bcm = mk(), t = mk(); for (let d = 0; d < nD; d++) { bcm[mOf[d]] += A.bcm[d]; t[mOf[d]] += A.t[d]; } return { A, coal: isCoal(A), bcm, t }; });
    const rampB = mk(), rampT = mk();
    for (let d = 0; d < nD; d++) { rampB[mOf[d]] += res.rampDaily[d]; if (res.rampTDaily) rampT[mOf[d]] += res.rampTDaily[d]; }
    const coalT = mk(), coalB = mk(), wasteB = mk(), wasteT = mk();
    for (const a of acts) for (let m = 0; m < nM; m++) { if (a.coal) { coalT[m] += a.t[m]; coalB[m] += a.bcm[m]; } else { wasteB[m] += a.bcm[m]; wasteT[m] += a.t[m]; } }
    for (let m = 0; m < nM; m++) { wasteB[m] += rampB[m]; wasteT[m] += rampT[m]; }

    // separate pits: what each one mined (ramp excavation is not split between them)
    let pits = null;
    if (res.pits) {
      pits = res.pits.map((z, k) => ({ pit: k, name: z.name, color: z.color })).concat([{ pit: -1, name: Model.REST, color: null }]).map(q => Object.assign(q, { coalT: mk(), coalB: mk(), wasteB: mk(), wasteT: mk(), n: 0 }));
      for (const a of acts) { const q = pits.find(x => x.pit === a.A.pit); if (!q) continue; q.n++; for (let m = 0; m < nM; m++) { if (a.coal) { q.coalT[m] += a.t[m]; q.coalB[m] += a.bcm[m]; } else { q.wasteB[m] += a.bcm[m]; q.wasteT[m] += a.t[m]; } } }
      pits = pits.filter(q => q.n);
    }

    // what was mined of each block and layer in each month: [month] -> Map(block * nL + layer -> {v, t})
    const plan = attrPlan(P).filter(q => q.mode);
    const adc = [], attrs = [];
    if (plan.length && ws) {
      const layOfAct = res.acts.map(A => A.layer);
      const cells = Array.from({ length: nM }, () => new Map());
      for (const r of res.records) {
        const M = cells[mOf[r.d]], k = r.b * nL + layOfAct[r.a];
        const q = M.get(k); if (q) { q.v += r.v; q.t += r.t; } else M.set(k, { v: r.v, t: r.t });
      }
      // volume of each layer in each block as it lies in the ground (a seam: before any thickness cut-off)
      const full = Model.blockVolumes(ws), raw = ws.cut ? ws.cut.rawVol : null;
      const inSitu = (b, l) => (L[l].type === 'coal' && raw ? raw[b][l] : full[b][l]);
      const coalL = L.map((x, l) => (x.type === 'coal' ? l : -1)).filter(l => l >= 0);
      const denom = new Map(); // block -> in-situ volume of the layers the column belongs to
      for (const q of plan) {
        const li = Model.layerIndex(P, q.layer), set = q.layer === 'coal' ? coalL : q.layer === 'block' ? L.map((x, l) => l) : li >= 0 ? [li] : [];
        const inSet = new Uint8Array(nL); for (const l of set) inSet[l] = 1;
        const val = P.blocks.map(b => { const v = b.attrs ? parseFloat(b.attrs[q.col]) : NaN; return isFinite(v) ? v : NaN; });
        const out = { col: q.col, mode: q.mode, layer: q.layer, layerName: layerLabel(P, q.layer), v: mk(), num: mk(), den: mk() };
        denom.clear();
        const den = b => { let d = denom.get(b); if (d === undefined) { d = 0; for (const l of set) d += inSitu(b, l); denom.set(b, d); } return d; };
        for (let m = 0; m < nM; m++) for (const [k, g] of cells[m]) {
          const l = k % nL, b = (k - l) / nL;
          if (!inSet[l] || !(val[b] === val[b])) continue;
          if (q.mode === 'avg') { out.num[m] += val[b] * g.t; out.den[m] += g.t; }
          else { const d = den(b); if (d > 1e-6) out.v[m] += val[b] * Math.min(1, g.v / d); }
        }
        if (q.mode === 'avg') { for (let m = 0; m < nM; m++) out.v[m] = out.den[m] > 0 ? out.num[m] / out.den[m] : NaN; out.total = sum(out.den) > 0 ? sum(out.num) / sum(out.den) : NaN; }
        else out.total = sum(out.v);
        (q.mode === 'adc' ? adc : attrs).push(out);
      }
    }
    const adcT = adc.length ? mk() : null;
    if (adcT) for (const a of adc) for (let m = 0; m < nM; m++) adcT[m] += a.v[m];

    // targets: the typed average, following the days of each month
    const T = P.targets || {}, basis = T.basis === 'working' ? 'working' : 'calendar', wasteUnit = T.wasteUnit === 't' ? 't' : 'bcm';
    const per = daysPerMonth(P), base = basis === 'working' ? work : days;
    const spread = avg => { if (!(+avg > 0)) return null; const a = mk(); for (let m = 0; m < nM; m++) a[m] = (+avg * base[m]) / per; return a; };
    const limit = T.mode !== 'compare'; // the schedule was held to the targets (if they were set when it ran)
    const target = { limit, coalAvg: +T.coal > 0 ? +T.coal : null, wasteAvg: +T.waste > 0 ? +T.waste : null, coal: spread(T.coal), waste: spread(T.waste), wasteUnit, basis, per };

    const nDays = sum(days), months = nDays / AVG_MONTH; // length of the schedule in average months
    return { k0, nM, mOf, days, work, nDays, months, acts, pits, rampB, rampT, coalT, coalB, wasteB, wasteT, adc, adcT, attrs, target, sum,
      label: m => U.MONTHS[(k0 + m) % 12] + '/' + Math.floor((k0 + m) / 12), date: m => new Date(Math.floor((k0 + m) / 12), (k0 + m) % 12, 1) };
  }

  return { build, attrPlan, numericColumns, autoMode, autoLayer, layerLabel, daysPerMonth, AVG_MONTH };
})();

/* ===== Cross-sections as DXF: the geology, the ground on a date and the placed spoil along a section line ===== */
const SecDxf = (() => {
  const PLAIN = { 'ø': 'o', 'Ø': 'O', 'æ': 'ae', 'Æ': 'AE', 'œ': 'oe', 'Œ': 'OE', 'ß': 'ss', 'đ': 'd', 'Đ': 'D', 'ł': 'l', 'Ł': 'L' };
  const lname = s => String(s == null ? '' : s).replace(/[øØæÆœŒßđĐłŁ]/g, c => PLAIN[c]).normalize('NFKD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9_\-]+/g, '_').replace(/^_+|_+$/g, '') || 'LAYER';
  const niceStep = (r, n) => { const raw = r / n, m = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / m; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * m; };

  /* The part of the line through (x, y) with direction (dx, dy) that lies inside the model; null if it misses it. */
  function clip(ws, x, y, dx, dy) {
    const L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, e = ws.cell * 0.5;
    const x0 = ws.x0 + e, x1 = ws.x0 + ws.nx * ws.cell - e, y0 = ws.y0 + e, y1 = ws.y0 + ws.ny * ws.cell - e;
    let t0 = -Infinity, t1 = Infinity;
    for (const [o, d, lo, hi] of [[x, ux, x0, x1], [y, uy, y0, y1]]) {
      if (Math.abs(d) < 1e-12) { if (o < lo || o > hi) return null; continue; }
      let a = (lo - o) / d, b = (hi - o) / d; if (a > b) [a, b] = [b, a];
      t0 = Math.max(t0, a); t1 = Math.min(t1, b);
    }
    if (!(t1 > t0 + ws.cell)) return null;
    return { a: [x + ux * t0, y + uy * t0], b: [x + ux * t1, y + uy * t1] };
  }
  /* Parallel section lines every `spacing` metres across the model, the given line being one of them.
     Returns [{a, b, offset}] ordered by offset (metres to the left of the line's direction). */
  function series(ws, a, b, spacing, max = 400) {
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
    const cs = [[ws.x0, ws.y0], [ws.x0 + ws.nx * ws.cell, ws.y0], [ws.x0, ws.y0 + ws.ny * ws.cell], [ws.x0 + ws.nx * ws.cell, ws.y0 + ws.ny * ws.cell]].map(c => (c[0] - a[0]) * nx + (c[1] - a[1]) * ny);
    const lo = Math.min(...cs), hi = Math.max(...cs), out = [];
    if (!(spacing > 0)) return [{ a, b, offset: 0 }];
    for (let k = Math.ceil(lo / spacing); k <= Math.floor(hi / spacing) && out.length < max; k++) {
      const seg = clip(ws, a[0] + nx * k * spacing, a[1] + ny * k * spacing, dx, dy);
      if (seg) out.push({ a: seg.a, b: seg.b, offset: k * spacing });
    }
    return out;
  }
  /* Elevations along a section, sampled every half cell. cur: ground on the date (in situ + spoil), ins: the excavated surface. */
  function profile(ws, a, b, cur, ins) {
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(2, Math.ceil(len / (ws.cell * 0.5)) + 1);
    const S = ws.surf, d = { a, b, len, n, s: [], x: [], y: [], topo: [], z: [], zi: [], strata: S.map(() => []), blk: [] };
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1), x = a[0] + (b[0] - a[0]) * t, y = a[1] + (b[1] - a[1]) * t;
      d.s.push(len * t); d.x.push(x); d.y.push(y);
      const tp = Model.sampleGrid(ws, ws.topo, x, y);
      d.topo.push(tp); d.z.push(cur ? Model.sampleGrid(ws, cur, x, y) : tp); d.zi.push(ins ? Model.sampleGrid(ws, ins, x, y) : tp);
      S.forEach((g, k) => d.strata[k].push(Model.sampleGrid(ws, g, x, y)));
      const c = Model.cellAt(ws, x, y); d.blk.push(c >= 0 ? ws.cellBlock[c] : -1);
    }
    return d;
  }

  const COLORS = { topsoil: 34, overburden: 42, coal: 250, interburden: 8 };
  /* DXF entities for one section.
     o.d3: true = in place, 3D lines at real coordinates (o.sign turns model coordinates into file coordinates);
           false = a section drawing: X = chainage, Y = elevation × o.vex, the whole drawing moved down by o.drop.
     o.title, o.sub: two lines of text above the frame. Returns {items, colors, height} (height of the drawing incl. frame). */
  function build(P, ws, d, o = {}) {
    const items = [], colors = {}, L = P.layers, nL = L.length, vex = o.d3 ? 1 : +o.vex > 0 ? +o.vex : 1, sign = o.sign || 1;
    let zlo = Infinity, zhi = -Infinity;
    for (let i = 0; i < d.n; i++) { zhi = Math.max(zhi, d.z[i], d.topo[i]); zlo = Math.min(zlo, d.strata[nL][i], d.zi[i]); }
    const step = niceStep(Math.max(1, zhi - zlo), 6);
    const f0 = Math.floor((zlo - step * 0.25) / step) * step, f1 = Math.ceil((zhi + step * 0.25) / step) * step; // frame, on round elevations
    const th = Math.min(12, Math.max(1.2, d.len / 220)); // text height, in drawing units (metres)
    // how far the drawing is moved down (sections stacked in one file): a number, or worked out from this section's frame
    const drop = typeof o.drop === 'function' ? o.drop(f0, f1, th, vex) : o.drop || 0;
    // a point of the section in drawing coordinates
    const pt = o.d3 ? (i, z) => [sign * d.x[i], sign * d.y[i], z] : (i, z) => [d.s[i], (z - f0) * vex + f0 - drop];
    const line = (layer, arr, color) => { colors[layer] = color; items.push({ kind: 'poly', layer, pts: arr.map((z, i) => pt(i, z)), d3: !!o.d3 }); };
    const region = (layer, color, top, bot, min) => { // closed outlines of the runs where top lies above bot
      colors[layer] = color;
      let i0 = -1;
      for (let i = 0; i <= d.n; i++) {
        const on = i < d.n && top[i] - bot[i] > min;
        if (on && i0 < 0) i0 = i;
        if (!on && i0 >= 0) {
          const i1 = i - 1;
          if (i1 > i0) { const pts = []; for (let k = i0; k <= i1; k++) pts.push(pt(k, top[k])); for (let k = i1; k >= i0; k--) pts.push(pt(k, bot[k])); items.push({ kind: 'poly', layer, pts, closed: true, d3: !!o.d3 }); }
          i0 = -1;
        }
      }
    };
    // what is still in the ground of each layer, and the spoil on top of it
    for (let l = 0; l < nL; l++) region(lname(L[l].name), COLORS[L[l].type] || 7, d.strata[l].map((v, i) => Math.min(v, d.zi[i])), d.strata[l + 1], 0.02);
    region('PLACED_SPOIL', 30, d.z, d.zi, 0.05);
    // the modelled surfaces (as loaded, through mined-out ground too), the excavation and the ground on the date
    (P.surfaces || []).forEach((sf, k) => { if (d.strata[k]) line('SURF_' + lname(sf.name), d.strata[k], k === 0 ? 8 : 9); });
    line('EXCAVATED_SURFACE', d.zi, 1);
    line('GROUND_ON_DATE', d.z, 3);
    // block boundaries and names
    colors.BLOCKS = 5; colors.BLOCK_NAMES = 5;
    let run = 0;
    for (let i = 1; i <= d.n; i++) {
      if (i < d.n && d.blk[i] === d.blk[run]) continue;
      if (i < d.n) { const a = pt(i, Math.max(d.z[i], d.topo[i])), b = pt(i, d.strata[nL][i]); items.push({ kind: 'line', layer: 'BLOCKS', a, b }); }
      const b = d.blk[run];
      if (b >= 0 && P.blocks[b] && d.s[i - 1] - d.s[run] > th * 3) {
        const m = (run + i - 1) >> 1; let top = -Infinity; for (let k = run; k < i; k++) top = Math.max(top, d.z[k], d.topo[k]);
        const q = pt(m, top); items.push({ kind: 'text', layer: 'BLOCK_NAMES', x: q[0], y: o.d3 ? q[1] : q[1] + th * 1.2, z: o.d3 ? q[2] + th * 1.2 : 0, text: String(P.blocks[b].id), h: th * 0.8 });
      }
      run = i;
    }
    let height = 0;
    if (o.d3) {
      colors.SECTION_LINE = 7;
      items.push({ kind: 'poly', layer: 'SECTION_LINE', pts: [pt(0, d.topo[0] + th * 3), pt(d.n - 1, d.topo[d.n - 1] + th * 3)], d3: true });
      const A = pt(0, d.topo[0] + th * 4), B = pt(d.n - 1, d.topo[d.n - 1] + th * 4);
      items.push({ kind: 'text', layer: 'SECTION_LINE', x: A[0], y: A[1], z: A[2], text: (o.label || 'A'), h: th * 1.6 }, { kind: 'text', layer: 'SECTION_LINE', x: B[0], y: B[1], z: B[2], text: (o.label || 'A') + "'", h: th * 1.6 });
    } else {
      // frame with an elevation scale on both sides and the chainage along the bottom
      colors.FRAME = 7; colors.FRAME_TEXT = 7;
      const Y = z => (z - f0) * vex + f0 - drop, y0 = Y(f0), y1 = Y(f1);
      items.push({ kind: 'poly', layer: 'FRAME', pts: [[0, y0], [d.len, y0], [d.len, y1], [0, y1]], closed: true });
      for (let z = f0; z <= f1 + 1e-6; z += step) {
        const y = Y(z);
        items.push({ kind: 'line', layer: 'FRAME', a: [-th, y], b: [0, y] }, { kind: 'line', layer: 'FRAME', a: [d.len, y], b: [d.len + th, y] });
        items.push({ kind: 'text', layer: 'FRAME_TEXT', x: -th * 1.5, y, text: z.toFixed(step < 1 ? 1 : 0), h: th, align: 'right' }, { kind: 'text', layer: 'FRAME_TEXT', x: d.len + th * 1.5, y, text: z.toFixed(step < 1 ? 1 : 0), h: th, align: 'left' });
      }
      const xs = niceStep(d.len, 10);
      for (let s = 0; s <= d.len + 1e-6; s += xs) {
        items.push({ kind: 'line', layer: 'FRAME', a: [s, y0], b: [s, y0 - th] });
        items.push({ kind: 'text', layer: 'FRAME_TEXT', x: s, y: y0 - th * 2.2, text: s.toFixed(0), h: th });
      }
      items.push({ kind: 'text', layer: 'FRAME_TEXT', x: 0, y: y1 + th * 1.4, text: o.label || 'A', h: th * 1.5 }, { kind: 'text', layer: 'FRAME_TEXT', x: d.len, y: y1 + th * 1.4, text: (o.label || 'A') + "'", h: th * 1.5 });
      if (o.title) items.push({ kind: 'text', layer: 'FRAME_TEXT', x: d.len / 2, y: y1 + th * 5.2, text: o.title, h: th * 1.5 });
      if (o.sub) items.push({ kind: 'text', layer: 'FRAME_TEXT', x: d.len / 2, y: y1 + th * 3, text: o.sub, h: th });
      height = (f1 - f0) * vex + th * 12;
    }
    return { items, colors, height, f0, f1, step, th, drop, bottom: f0 - drop - th * 3.5 };
  }

  /* The whole file: one section or a stack of them. sections: [{a, b, offset, label, title, sub}] */
  function file(P, ws, sections, o = {}) {
    const all = [], colors = {};
    let prev = null; // lowest point of the section drawn before: the next one goes below it
    for (const sc of sections) {
      const d = profile(ws, sc.a, sc.b, o.cur, o.ins);
      const r = build(P, ws, d, { d3: o.d3, vex: o.vex, sign: o.sign, label: sc.label, title: sc.title, sub: sc.sub,
        drop: (f0, f1, th, vex) => (prev == null ? 0 : (f1 - f0) * vex + f0 + th * 7 - (prev - th * 6)) });
      for (const it of r.items) all.push(it);
      Object.assign(colors, r.colors);
      prev = r.bottom;
    }
    return Dxf.write(all, colors);
  }

  return { clip, series, profile, build, file, lname };
})();

/* ===== Project storage: IndexedDB (standalone), artifact db (shared, owner writes), memory (view-only file) ===== */
const Store = (() => {
  // ---------- IndexedDB ----------
  function idbOpen() {
    return new Promise((res, rej) => {
      const rq = indexedDB.open('rollover-mine-sim', 1);
      rq.onupgradeneeded = () => { const db = rq.result; if (!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', { keyPath: 'id' }); if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs'); };
      rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
    });
  }
  function tx(db, store, mode, fn) {
    return new Promise((res, rej) => { const t = db.transaction(store, mode); const s = t.objectStore(store); let out; const r = fn(s); if (r) r.onsuccess = () => (out = r.result); t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  }
  async function IDB() {
    const db = await idbOpen();
    return {
      kind: 'idb', canWrite: true, label: 'Saved in this browser',
      async list() { const all = (await tx(db, 'projects', 'readonly', s => s.getAll())) || []; return all.map(meta).sort((a, b) => (b.modified || '').localeCompare(a.modified || '')); },
      async load(id) { return tx(db, 'projects', 'readonly', s => s.get(id)); },
      async save(P) { P.modified = new Date().toISOString(); await tx(db, 'projects', 'readwrite', s => s.put(JSON.parse(JSON.stringify(P)))); },
      async remove(id) {
        await tx(db, 'projects', 'readwrite', s => s.delete(id));
        await tx(db, 'blobs', 'readwrite', s => s.delete(IDBKeyRange.bound(id + '/', id + '/ ')));
      },
      async putBlob(id, key, u8) { await tx(db, 'blobs', 'readwrite', s => s.put(u8, id + '/' + key)); },
      async getBlob(id, key) { const v = await tx(db, 'blobs', 'readonly', s => s.get(id + '/' + key)); return v ? new Uint8Array(v) : null; },
      async delBlob(id, key) { await tx(db, 'blobs', 'readwrite', s => s.delete(id + '/' + key)); }
    };
  }
  const meta = P => ({ id: P.id, name: P.name, modified: P.modified, startDate: P.startDate, description: P.description || '', blocks: (P.blocks || []).length, isDemo: !!P.isDemo });

  // ---------- artifact db (chunked, gzip + base64) ----------
  function Cloud(db, canWrite) {
    const CH = 170000; // base64 characters per chunk document
    const metaCache = new Map();
    const col = pid => db.collection('projects/' + pid + '/chunks');
    async function retry(fn) { try { return await fn(); } catch (e) { if (e && e.code === 'unavailable') { await U.sleep(400 + Math.random() * 600); return fn(); } throw e; } }
    async function getMeta(pid) {
      if (metaCache.has(pid)) return metaCache.get(pid);
      const s = await retry(() => db.doc('projects/' + pid).get());
      const m = s.exists ? Object.assign({}, s.data()) : null;
      if (m) metaCache.set(pid, m);
      return m;
    }
    async function writeChunks(pid, key, u8, oldN) {
      const b64 = U.u8ToB64(await U.gzip(u8));
      const n = Math.max(1, Math.ceil(b64.length / CH));
      for (let i = 0; i < n; i++) await retry(() => col(pid).doc(key + '~' + i).set({ d: b64.slice(i * CH, (i + 1) * CH), i, n }));
      for (let i = n; i < (oldN || 0); i++) await retry(() => col(pid).doc(key + '~' + i).delete());
      return n;
    }
    async function readChunks(pid, key, n) {
      const parts = await Promise.all(Array.from({ length: n }, (_, i) => retry(() => col(pid).doc(key + '~' + i).get())));
      const b64 = parts.map(p => (p.exists ? p.data().d : '')).join('');
      if (!b64) return null;
      return U.gunzip(U.b64ToU8(b64));
    }
    return {
      kind: 'cloud', canWrite, label: canWrite ? 'Saved with this shared page' : 'Shared with you (view only)',
      async list() {
        const q = await retry(() => db.collection('projects').get());
        return q.docs.filter(d => d.exists).map(d => { const m = d.data(); metaCache.set(d.id, Object.assign({}, m)); return { id: d.id, name: m.name, modified: m.modified, startDate: m.startDate, description: m.description || '', blocks: m.blocks || 0, isDemo: !!m.isDemo }; })
          .sort((a, b) => (b.modified || '').localeCompare(a.modified || ''));
      },
      async load(id) {
        const m = await getMeta(id);
        if (!m) return null;
        const u8 = await readChunks(id, 'json', m.jsonN || 1);
        return u8 ? JSON.parse(U.u8ToStr(u8)) : null;
      },
      async save(P) {
        P.modified = new Date().toISOString();
        const m = (await getMeta(P.id)) || { blobs: {} };
        const n = await writeChunks(P.id, 'json', U.strToU8(JSON.stringify(P)), m.jsonN);
        const nm = Object.assign({}, m, { name: P.name, modified: P.modified, startDate: P.startDate, description: P.description || '', blocks: P.blocks.length, isDemo: !!P.isDemo, jsonN: n, blobs: m.blobs || {} });
        await retry(() => db.doc('projects/' + P.id).set(nm));
        metaCache.set(P.id, nm);
      },
      async remove(id) {
        const m = await getMeta(id);
        if (m) {
          for (let i = 0; i < (m.jsonN || 0); i++) await retry(() => col(id).doc('json~' + i).delete());
          for (const [k, n] of Object.entries(m.blobs || {})) for (let i = 0; i < n; i++) await retry(() => col(id).doc(k + '~' + i).delete());
        }
        await retry(() => db.doc('projects/' + id).delete());
        metaCache.delete(id);
      },
      async putBlob(id, key, u8) {
        const m = (await getMeta(id)) || { blobs: {} };
        const n = await writeChunks(id, key, u8, (m.blobs || {})[key]);
        const nm = Object.assign({}, m, { blobs: Object.assign({}, m.blobs || {}, { [key]: n }) });
        await retry(() => db.doc('projects/' + id).set(nm));
        metaCache.set(id, nm);
      },
      async getBlob(id, key) { const m = await getMeta(id); const n = m && m.blobs && m.blobs[key]; return n ? readChunks(id, key, n) : null; },
      async delBlob(id, key) {
        const m = await getMeta(id); const n = m && m.blobs && m.blobs[key];
        if (!n) return;
        for (let i = 0; i < n; i++) await retry(() => col(id).doc(key + '~' + i).delete());
        const b = Object.assign({}, m.blobs); delete b[key];
        const nm = Object.assign({}, m, { blobs: b });
        await retry(() => db.doc('projects/' + id).set(nm)); metaCache.set(id, nm);
      },
      invalidate() { metaCache.clear(); }
    };
  }

  // ---------- memory ----------
  function Memory(projects, blobs, canWrite, label) {
    const P = new Map(projects.map(p => [p.id, p])), B = new Map(Object.entries(blobs || {}));
    return {
      kind: 'memory', canWrite: !!canWrite, label: label || 'Not saved',
      async list() { return Array.from(P.values()).map(meta); },
      async load(id) { const p = P.get(id); return p ? JSON.parse(JSON.stringify(p)) : null; },
      async save(p) { p.modified = new Date().toISOString(); P.set(p.id, JSON.parse(JSON.stringify(p))); },
      async remove(id) { P.delete(id); for (const k of Array.from(B.keys())) if (k.startsWith(id + '/')) B.delete(k); },
      async putBlob(id, key, u8) { B.set(id + '/' + key, u8); },
      async getBlob(id, key) { return B.get(id + '/' + key) || null; },
      async delBlob(id, key) { B.delete(id + '/' + key); }
    };
  }

  // ---------- helpers ----------
  function packSurfaces(surf) {
    const n = surf[0].length, all = new Float32Array(n * surf.length);
    surf.forEach((s, k) => all.set(s, k * n));
    return U.encodeGrid(all);
  }
  function unpackSurfaces(u8, nS, n) {
    const all = U.decodeGrid(u8);
    return Array.from({ length: nS }, (_, k) => all.slice(k * n, (k + 1) * n));
  }
  // Portable project file: project JSON + blobs (base64 of gzip)
  async function exportBundle(store, P, fallback = {}) {
    const blobs = {};
    for (const key of ['grid', 'sat']) { const u8 = (await store.getBlob(P.id, key)) || fallback[key]; if (u8) blobs[key] = U.u8ToB64(await U.gzip(u8)); }
    return { format: 'rollover-mine-sim', version: 1, exported: new Date().toISOString(), project: P, blobs };
  }
  async function readBundle(obj) {
    if (!obj || obj.format !== 'rollover-mine-sim' || !obj.project) throw new Error('This file is not a Rollover project file.');
    const blobs = {};
    for (const [k, v] of Object.entries(obj.blobs || {})) blobs[k] = await U.gunzip(U.b64ToU8(v));
    return { project: obj.project, blobs };
  }

  return { IDB, Cloud, Memory, packSurfaces, unpackSurfaces, exportBundle, readBundle };
})();

  function activityCapacity(a, graph) {
    const P = App.P, ws = App.ws, H = +P.calendar.hoursPerDay || 22;
    const l = Model.layerIndex(P, a.layerId); if (l < 0) return { note: 'No layer' };
    const L = P.layers[l];
    const eq = Model.actFleet(P, a).filter(e => (+e.qty || 0) > 0);
    const dz = eq.filter(e => e.kind === 'dozer').reduce((s, e) => s + (+e.prod || 0) * e.qty * H * e.avail * e.util, 0);
    if (a.method === 'dozer_push') return { exc: dz, trk: null, push: true, note: dz ? 'Dozers' : 'No dozers assigned' };
    const exc = eq.filter(e => e.kind === 'excavator'), trk = eq.filter(e => e.kind === 'truck');
    if (a.method === 'mixed') {
      if (!exc.length) return { exc: dz, trk: null, push: true, note: dz ? 'Dozers only (no excavator assigned)' : 'No equipment assigned' };
      const t = activityCapacity(Object.assign({}, a, { method: 'truck_shovel' }), graph);
      return dz ? Object.assign(t, { doz: dz, note: 'Dozers + truck & shovel · ' + t.note }) : Object.assign(t, { note: 'Truck & shovel only (no dozers assigned) · ' + t.note });
    }
    const ex = exc.reduce((s, e) => s + Sim.excBcmH(e, L.swell) * e.qty * H * e.avail * e.util, 0);
    if (!trk.length) return { exc: ex, trk: null, note: exc.length ? 'Loading (no trucks)' : 'No excavators assigned' };
    const b = a.path.length ? ws.blockIndex.get(a.path[0]) : undefined;
    const dump = P.dumps.find(d => d.id === (Model.actDests(a)[0] || {}).dump);
    let rt = { dist: 1500, ramp: 300 };
    if (b !== undefined && dump) {
      const c = ws.blockCentroid[b], e = dump.entry || Geo.centroid(dump.pts);
      const cc = ws.blockCells[b][0] || 0;
      rt = Sim.route(graph, c[0], c[1], (ws.surf[l][cc] + ws.surf[l + 1][cc]) / 2, e[0], e[1], Model.sampleGrid(ws, ws.topo, e[0], e[1]));
    }
    const dens = b !== undefined ? Model.blockDensity(P, b, l) : L.density;
    let tr = 0, cyc = null;
    for (const t of trk) { const cy = Sim.truckCycle(t, exc[0], L.swell, dens, rt); cyc = cyc || cy; tr += ((cy.bcmLoad * 60) / cy.cycle) * t.qty * H * t.avail * t.util; }
    return { exc: ex, trk: tr, note: `${ex <= tr ? 'Loading' : 'Hauling'} · ${U.fmtNum(rt.dist / 1000, 1)} km haul, ${cyc ? cyc.cycle.toFixed(1) : '–'} min cycle` };
  }

    const act = P.activities.find(a => a.id === e.activityId);

const Charts = (() => {

  }

    const iso = P.startDate;
    const mk = d => { const t = U.dayDate(iso, d); return t.getUTCFullYear() * 12 + t.getUTCMonth(); };
    const k0 = mk(0), k1 = mk(res.nDays - 1), nM = k1 - k0 + 1;
    const series = [];

    const tgtRaw = mo ? (which === 'coal' ? mo.target.coal : mo.target.waste) : null, tgt = tgtRaw && tgtRaw.length === nM ? Array.from(tgtRaw, v => v / 1000) : null;
    for (const A of res.acts) {
      const isCoal = A.type === 'coal';
      if ((which === 'coal') !== isCoal) continue;
      const v = new Float64Array(nM);
      for (let d = 0; d < res.nDays; d++) v[mk(d) - k0] += (which === 'coal' || inT ? A.t[d] : A.bcm[d]) / 1000;
      series.push({ name: A.name, color: A.color, v });
    }
    if (which === 'waste') {

      const rd = inT ? res.rampTDaily : res.rampDaily;
      for (let d = 0; d < res.nDays; d++) { v[mk(d) - k0] += rd[d] / 1000; any += rd[d]; }
      if (any > 0) series.push({ name: 'Ramp excavation', color: '#898781', v });
    }
    if (!series.length) { container.append(h('div', { class: 'hint' }, 'Nothing to show.')); return; }
    const H = 170, { cv, ctx, w } = setup(container, H);
    legend(container, series.map(s => [s.name, s.color]).concat(tgt ? [['Target', css('--ink'), true]] : []));
    const tot = new Float64Array(nM); for (const s of series) for (let m = 0; m < nM; m++) tot[m] += s.v[m];
    const max = Math.max(...tot, ...(tgt || [0])) || 1, step = niceStep(max), top = Math.ceil(max / step) * step;
    const L = 40, R = 6, T = 8, B = 20, pw = w - L - R, ph = H - T - B;

    const band = pw / nM, bw = Math.max(2, Math.min(24, band * 0.72));
    const draw = hover => {

/* ===== Timeline: dated schedule strip with activity bars, scrubbing and playback ===== */
const Timeline = (() => {
  let cv, ctx, res = null, P = null, day = -1, playing = false, lastT = 0, acc = 0, hoverX = null, stale = false;
  const AXIS = 20, ROW = 9, PADL = 8, PADR = 8;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function init(canvas) {
    cv = canvas; ctx = cv.getContext('2d');
    new ResizeObserver(draw).observe(cv);
    let drag = false;
    const toDay = e => { const r = cv.getBoundingClientRect(); return xToDay(e.clientX - r.left, r.width); };
    cv.addEventListener('pointerdown', e => { if (!res) return; drag = true; cv.setPointerCapture(e.pointerId); pause(); App.seek(toDay(e)); });
    cv.addEventListener('pointermove', e => {
      const r = cv.getBoundingClientRect(); hoverX = e.clientX - r.left;
      if (drag && res) App.seek(toDay(e));
      if (res) { const d = U.clamp(toDay(e), 0, res.nDays - 1); UI.tip(e.clientX, e.clientY - 34, `<b>${U.fmtDay(P.startDate, d)}</b> · day ${d + 1}${res.working[d] ? '' : ' · non-working'}`); }
      draw();
    });
    cv.addEventListener('pointerup', () => { drag = false; });
    cv.addEventListener('pointerleave', () => { hoverX = null; UI.tip(null); draw(); });
    document.getElementById('tlPlay').addEventListener('click', () => (playing ? pause() : play()));
    document.getElementById('tlStart').addEventListener('click', () => { pause(); if (res) App.seek(-1); });
    document.getElementById('tlEnd').addEventListener('click', () => { pause(); if (res) App.seek(res.nDays - 1); });
    window.addEventListener('keydown', e => {
      if (!res || /INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '') || View.isDrawing()) return;
      if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
      else if (e.key === 'ArrowRight') { pause(); App.seek(day + (e.shiftKey ? 30 : 1)); }
      else if (e.key === 'ArrowLeft') { pause(); App.seek(day - (e.shiftKey ? 30 : 1)); }
    });
  }
  function dims() { const w = cv.clientWidth || 600; const rows = res ? res.acts.length : 3; return { w, h: AXIS + rows * ROW + 8 }; }
  function dayToX(d, w) { return PADL + ((d + 0.5) / Math.max(1, res.nDays)) * (w - PADL - PADR); }
  function xToDay(x, w) { return Math.floor(((x - PADL) / (w - PADL - PADR)) * res.nDays); }

  function setData(r, project) {
    res = r; P = project; day = -1; stale = false; pause();
    document.getElementById('tlSub').textContent = r ? `Schedule ${U.fmtDay(P.startDate, 0)} → ${U.fmtDay(P.startDate, r.nDays - 1)}` : project ? `Starts ${U.fmtDate(U.parseISO(project.startDate))} · run the simulation to fill the timeline` : '';
    document.getElementById('tlDate').textContent = project ? U.fmtDate(U.parseISO(project.startDate)) : '––/–––/––––';
    renderStats();
    draw();
  }
  function setStale(s) { stale = s; if (res) document.getElementById('tlSub').textContent = s ? 'Inputs changed — run the simulation again' : `Schedule ${U.fmtDay(P.startDate, 0)} → ${U.fmtDay(P.startDate, res.nDays - 1)}`; }
  function setDay(d) {
    day = d;
    const el = document.getElementById('tlDate');
    el.textContent = d < 0 ? U.fmtDate(U.parseISO(P.startDate)) : U.fmtDay(P.startDate, d);
    if (!stale) document.getElementById('tlSub').textContent = d < 0 ? `Before mining · schedule ends ${U.fmtDay(P.startDate, res.nDays - 1)}` : `Day ${U.fmtNum(d + 1)} of ${U.fmtNum(res.nDays)}${res.working[d] ? '' : ' · non-working day'}`;
    renderStats();
    draw();
  }
  let cum = null;
  function renderStats() {
    const el = document.getElementById('tlStats');
    if (!res) { el.innerHTML = ''; cum = null; return; }
    if (!cum || cum.res !== res) {
      const n = res.nDays, coal = new Float64Array(n), waste = new Float64Array(n);
      let c = 0, w = 0;
      for (let d = 0; d < n; d++) {
        for (const A of res.acts) { if (A.type === 'coal') c += A.t[d]; else w += A.bcm[d]; }
        w += res.rampDaily[d];
        coal[d] = c; waste[d] = w;
      }
      cum = { res, coal, waste };
    }
    const d = day, c = d >= 0 ? cum.coal[d] : 0, w = d >= 0 ? cum.waste[d] : 0;
    const done = d >= 0 ? Array.from(res.blockDoneDay).filter(x => x >= 0 && x <= d).length : 0;
    el.innerHTML = [
      ['Coal to date', U.fmtBig(c, 't')], ['Waste to date', U.fmtBig(w, 'bcm')], ['Strip ratio', c > 0 ? (w / c).toFixed(2) + ' bcm/t' : '–'], ['Blocks complete', `${done} / ${res.bl.length}`]
    ].map(([k, v]) => `<div class="st"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  }
  function niceTicks(w) {
    const n = res.nDays, pxPerDay = (w - PADL - PADR) / n;
    const opts = [[1, 'm'], [2, 'm'], [3, 'm'], [6, 'm'], [12, 'm'], [24, 'm'], [60, 'm']];
    let step = opts[opts.length - 1];
    for (const o of opts) if (o[0] * 30.4 * pxPerDay >= 92) { step = o; break; }
    const ticks = [];
    const s = U.parseISO(P.startDate);
    let y = s.getUTCFullYear(), m = s.getUTCMonth() + 1;
    if (m > 11) { m = 0; y++; }
    // align to multiples of step months from January
    while ((y * 12 + m) % step[0] !== 0) { m++; if (m > 11) { m = 0; y++; } }
    for (;;) {
      const dt = new Date(Date.UTC(y, m, 1));
      const di = Math.round((dt - s) / U.DAY_MS);
      if (di >= n) break;
      if (di >= 0) ticks.push(di);
      m += step[0]; while (m > 11) { m -= 12; y++; }
    }
    return ticks;
  }
  function draw() {
    if (!cv) return;
    const { w, h } = dims(), dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.height = h + 'px'; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const ink = css('--ink'), muted = css('--muted'), grid = css('--line'), acc = css('--accent'), field = css('--field');
    ctx.font = `11px ${css('--font-mono') || 'monospace'}`;
    if (!res) {
      ctx.fillStyle = field; ctx.fillRect(PADL, AXIS, w - PADL - PADR, h - AXIS - 6);
      ctx.fillStyle = muted; ctx.textBaseline = 'middle';
      ctx.fillText(P ? `${U.fmtDate(U.parseISO(P.startDate))} — press Run simulation to build the schedule` : '', PADL + 8, AXIS + (h - AXIS - 6) / 2);
      return;
    }
    // ticks
    const ticks = niceTicks(w);
    ctx.textBaseline = 'alphabetic'; ctx.lineWidth = 1;
    for (const d of ticks) {
      const x = Math.round(dayToX(d, w)) + 0.5;
      ctx.strokeStyle = grid; ctx.beginPath(); ctx.moveTo(x, AXIS - 4); ctx.lineTo(x, h - 4); ctx.stroke();
      ctx.fillStyle = muted; ctx.fillText(U.fmtDay(P.startDate, d), x + 3, 12);
    }
    // non-working shading is implicit (gaps); activity rows
    res.acts.forEach((A, i) => {
      const y = AXIS + i * ROW + 1;
      ctx.fillStyle = A.color;
      ctx.globalAlpha = stale ? 0.35 : 0.95;
      let run = -1;
      const onDay = d => { if (d >= res.nDays) return false; if (A.bcm[d] > 0) return true; let a = d, b = d; while (a >= 0 && !(A.bcm[a] > 0) && d - a <= 3) a--; while (b < res.nDays && !(A.bcm[b] > 0) && b - d <= 3) b++; return a >= 0 && b < res.nDays && A.bcm[a] > 0 && A.bcm[b] > 0 && b - a <= 4; };
      for (let d = 0; d <= res.nDays; d++) {
        const on = onDay(d);
        if (on && run < 0) run = d;
        if (!on && run >= 0) { const x0 = dayToX(run, w) - 0.5 * (w / res.nDays), x1 = dayToX(d - 1, w) + 0.5 * (w / res.nDays); ctx.fillRect(x0, y, Math.max(1, x1 - x0), ROW - 3); run = -1; }
      }
      ctx.globalAlpha = 1;
    });
    // cursor
    if (day >= 0) {
      const x = Math.round(dayToX(day, w)) + 0.5;
      ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, AXIS - 6); ctx.lineTo(x, h - 2); ctx.stroke();
      ctx.fillStyle = acc; ctx.beginPath(); ctx.moveTo(x - 5, AXIS - 10); ctx.lineTo(x + 5, AXIS - 10); ctx.lineTo(x, AXIS - 4); ctx.fill();
    }
    if (hoverX != null) { ctx.strokeStyle = ink; ctx.globalAlpha = 0.35; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(hoverX + 0.5, AXIS); ctx.lineTo(hoverX + 0.5, h - 2); ctx.stroke(); ctx.globalAlpha = 1; }
  }
  function speed() { return +document.getElementById('tlSpeed').value || 15; }
  function play() {
    if (!res) { App.runSim(); return; }
    if (day >= res.nDays - 1) App.seek(-1);
    playing = true; lastT = performance.now(); acc = 0;
    document.getElementById('tlPlay').innerHTML = '<svg viewBox="0 0 16 16"><path d="M4 3h3v10H4zM9 3h3v10H9z" fill="currentColor"/></svg>';
    requestAnimationFrame(tick);
  }
  function pause() {
    playing = false;
    const b = document.getElementById('tlPlay');
    if (b) b.innerHTML = '<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>';
  }
  function tick(t) {
    if (!playing || !res) return;
    const dt = Math.min(0.25, (t - lastT) / 1000); lastT = t;
    acc += dt * speed();
    const step = Math.floor(acc);
    if (step >= 1) { acc -= step; App.seek(Math.min(res.nDays - 1, day + step)); }
    if (day >= res.nDays - 1) { pause(); return; }
    requestAnimationFrame(tick);
  }
  return { init, setData, setDay, setStale, draw, play, pause, get playing() { return playing; } };
})();

/* ===== Excel schedule report (SheetJS) ===== */
const Report = (() => {
  const localDate = d => (d ? new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) : null);
  const dayLocal = (iso, i) => (i == null || i < 0 ? null : localDate(U.dayDate(iso, i)));
  const r2 = v => (v == null || !isFinite(v) ? null : Math.round(v * 100) / 100);
  const r0 = v => (v == null || !isFinite(v) ? null : Math.round(v));

  function sheet(aoa, widths) {
    const ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates: true });
    const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
    for (let R = range.s.r; R <= range.e.r; R++) for (let C = range.s.c; C <= range.e.c; C++) {
      const c = ws[XLSX.utils.encode_cell({ r: R, c: C })];
      if (!c) continue;
      if (c.t === 'd') c.z = 'dd/mmm/yyyy';
      else if (c.t === 'n' && R > 0 && !Number.isInteger(c.v)) c.z = '#,##0.00';
      else if (c.t === 'n' && R > 0 && Math.abs(c.v) >= 1000) c.z = '#,##0';
    }
    ws['!cols'] = (widths || aoa[0].map(h => Math.max(10, String(h || '').length + 2))).map(w => ({ wch: w }));
    if (aoa.length > 1) ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: 0, c: range.e.c } }) };
    return ws;
  }

  /* Monthly summary, months read across. Tonnes and bcm mined come from the schedule; ADC tonnes and the other block
     attributes come from the attribute file, for what is mined in each month; targets are the typed monthly averages
     following the days of each month. */
  function monthlySheet(P, ws, res) {
    const M = Monthly.build(P, ws, res), nM = M.nM, T = M.target;
    const head = ['Item', 'Unit', 'Total', 'Average per month'];
    for (let m = 0; m < nM; m++) head.push(M.date(m));
    const rows = [head], fmt = []; // fmt[r]: decimals of the row's numbers
    const arr = a => Array.from(a);
    const add = (label, unit, a, o = {}) => {
      const tot = o.total !== undefined ? o.total : M.sum(a), dp = o.dp || 0, rd = v => (v == null || !isFinite(v) ? null : dp ? Math.round(v * Math.pow(10, dp)) / Math.pow(10, dp) : Math.round(v));
      rows.push([label, unit, rd(tot), o.avg !== undefined ? rd(o.avg) : o.noAvg ? null : rd(M.sum(a) / M.months), ...arr(a).map(rd)]);
      fmt[rows.length - 1] = dp;
    };
    const title = t => rows.push([t]), gap = () => rows.push([]);
    const diff = (a, b) => arr(a).map((v, m) => v - b[m]);
    const basisTxt = T.basis === 'working' ? 'working days' : 'calendar days';
    add('Days in the schedule', 'days', M.days, { noAvg: true });
    add('Working days', 'days', M.work, { noAvg: true });
    gap(); title('COAL');
    if (T.coal) add(`Coal target (${U.fmtNum(T.coalAvg, 0)} t in an average month, following the ${basisTxt})`, 't', T.coal, { avg: T.coalAvg });
    add('Coal mined — schedule', 't', M.coalT);
    if (T.coal) add('Coal mined − target', 't', diff(M.coalT, T.coal));
    if (M.adcT) {
      add('ADC tons — block attributes', 't', M.adcT);
      if (T.coal) add('ADC tons − target', 't', diff(M.adcT, T.coal));
    }
    add('Coal mined — schedule', 'bcm', M.coalB);
    const adcUsed = new Set();
    for (const a of M.acts) {
      if (!a.coal) continue;
      add(`${a.A.name}: mined — schedule`, 't', a.t);
      add(`${a.A.name}: mined — schedule`, 'bcm', a.bcm);
      const ly = P.layers[a.A.layer];
      M.adc.forEach((q, i) => { if (ly && q.layer === ly.id) { adcUsed.add(i); add(`${a.A.name}: ADC tons (${q.col})`, 't', q.v); } });
    }
    M.adc.forEach((q, i) => { if (!adcUsed.has(i)) add(`ADC tons (${q.col}) — ${q.layerName}`, 't', q.v); });
    gap(); title('WASTE');
    const wu = T.wasteUnit, wAct = wu === 't' ? M.wasteT : M.wasteB;
    if (T.waste) add(`Waste target (${U.fmtNum(T.wasteAvg, 0)} ${wu} in an average month, following the ${basisTxt})`, wu, T.waste, { avg: T.wasteAvg });
    add('Waste moved — schedule', wu, wAct);
    if (T.waste) add('Waste moved − target', wu, diff(wAct, T.waste));
    add('Waste moved — schedule', wu === 't' ? 'bcm' : 't', wu === 't' ? M.wasteB : M.wasteT);
    for (const a of M.acts) {
      if (a.coal) continue;
      add(`${a.A.name}: moved — schedule`, 'bcm', a.bcm);
      add(`${a.A.name}: moved — schedule`, 't', a.t);
    }
    if (M.sum(M.rampB) > 0) { add('Ramp excavation', 'bcm', M.rampB); add('Ramp excavation', 't', M.rampT); }
    gap();
    add('Strip ratio', 'bcm/t', arr(M.wasteB).map((v, m) => (M.coalT[m] > 0 ? v / M.coalT[m] : NaN)), { dp: 2, total: M.sum(M.coalT) > 0 ? M.sum(M.wasteB) / M.sum(M.coalT) : null, noAvg: true });
    if (M.pits) {
      gap(); title('BY PIT');
      for (const q of M.pits) {
        add(`${q.name}: coal mined`, 't', q.coalT);
        add(`${q.name}: coal mined`, 'bcm', q.coalB);
        add(`${q.name}: waste moved`, 'bcm', q.wasteB);
        add(`${q.name}: waste moved`, 't', q.wasteT);
        add(`${q.name}: strip ratio`, 'bcm/t', arr(q.wasteB).map((v, m) => (q.coalT[m] > 0 ? v / q.coalT[m] : NaN)), { dp: 2, total: M.sum(q.coalT) > 0 ? M.sum(q.wasteB) / M.sum(q.coalT) : null, noAvg: true });
      }
    }
    if (M.attrs.length) {
      gap(); title('BLOCK ATTRIBUTES — for what is mined in each month');
      for (const q of M.attrs) {
        const big = Math.abs(q.total) >= 1000;
        if (q.mode === 'avg') add(`${q.col} — ${q.layerName}, average weighted by tonnes`, '', q.v, { dp: big ? 0 : 2, total: q.total, noAvg: true });
        else add(`${q.col} — ${q.layerName}, total`, '', q.v, { dp: big ? 0 : 2 });
      }
    }
    gap();
    title('Tonnes and bcm are what the schedule mines. Average per month = total ÷ days in the schedule × 30.44 (an average month).');
    if ((T.coal || T.waste) && res.target && res.target.limit) title('The schedule was held to the targets: no month mines more than its target.');
    if (T.coal || T.waste) title(`Targets: the typed average for a month, multiplied by the ${basisTxt} of each month ÷ ${U.fmtNum(T.per, 2)} (${T.basis === 'working' ? 'the working days in an average month' : 'the days in an average month'}). The first and last month count only their days inside the schedule.`);
    if (M.pits) title('By pit: what the activities of each pit mine. Ramp excavation is not split between the pits, so the pits’ waste adds up to the total less the ramp excavation.');
    if (M.adc.length) title('ADC tons: the ADC tons of each block from the attribute file × the share of its seam mined in the month.');
    const sh = XLSX.utils.aoa_to_sheet(rows, { cellDates: true });
    for (let R = 0; R < rows.length; R++) for (let C = 0; C < head.length; C++) {
      const c = sh[XLSX.utils.encode_cell({ r: R, c: C })];
      if (!c) continue;
      if (c.t === 'd') c.z = 'mmm/yyyy';
      else if (c.t === 'n' && R > 0) c.z = fmt[R] ? '#,##0.00' : '#,##0';
    }
    sh['!cols'] = [{ wch: 58 }, { wch: 7 }, { wch: 15 }, { wch: 17 }, ...Array.from({ length: nM }, () => ({ wch: 12 }))];
    return sh;
  }

  function build(App) {
    const P = App.P, ws = App.ws, res = App.res, iso = P.startDate;
    const L = P.layers, nL = L.length;
    const wb = XLSX.utils.book_new();
    const actByLayer = l => P.activities.find(a => a.layerId === L[l].id);
    const attrCols = (P.attrColumns || []).filter(c => c !== P.idColumn);
    // depth limits (current settings): blocks stopped at a layer, and what is left below it
    const DL = ws ? Model.blockLimits(P, ws) : { any: false };
    const vols = res ? res.vol0 : Model.blockVolumes(ws).map((v, b) => (DL.any ? v.map((x, l) => (l > DL.lim[b] ? 0 : x)) : v));
    const belowV = DL.any ? (res && res.below ? res.below : Model.blockVolumes(ws).map((v, b) => v.map((x, l) => (l > DL.lim[b] ? x : 0)))) : null;

    // keep-out zones (current settings)

    const P = this.P;

    this.refreshKeep();

  // KML overlays draped on their surface, and the keep-out zones (hatched, with the mining limit line)
  refreshKeep() {

    if (!P || !ws) return;
    const list = [], sig = [ws.nx, ws.ny, ws.cell, ws.x0, ws.y0, JSON.stringify(P.crs)];
    for (const ov of P.overlays || []) {
      if (!ov.show) continue;

      const feats = Keep.features(P, ov).filter(F => ov.folders[F.f] && ov.folders[F.f].show !== false);

  refreshTint() {

    } else if (mode === 'sequence') {
      const a = P.activities.find(x => x.id === this.actId) || P.activities[0];

      else if (a) a.path.forEach((id, k) => { const b = ws.blockIndex.get(id); if (b !== undefined) { val[b] = k; lo = Math.min(lo, k); hi = Math.max(hi, k); } });
      for (let b = 0; b < val.length; b++) if (val[b] != null) { const c = U.ramp(hi > lo ? (val[b] - lo) / (hi - lo) : 0.5); cellColor[b] = [c[0], c[1], c[2], 170]; }
      legend = { type: 'ramp', title: a ? (this.res ? `${a.name} — start date` : `${a.name} — sequence`) : 'Sequence', lo: this.res && isFinite(lo) ? U.fmtDay(P.startDate, lo) : isFinite(lo) ? String(lo + 1) : '', hi: this.res && isFinite(hi) ? U.fmtDay(P.startDate, hi) : isFinite(hi) ? String(hi + 1) : '' };
    } else if (mode === 'pit') {
      const pitOf = Model.blockPits(P, ws), pits = P.pits || [];
      let rest = 0;
      for (let b = 0; b < pitOf.length; b++) { const k = pitOf[b]; if (k < 0) rest++; const c = U.hexToRgb(k >= 0 ? pits[k].color : '#8a8f98'); cellColor[b] = [c[0], c[1], c[2], k >= 0 ? 165 : 120]; }

      const col = this.colorAttr;
      let lo = Infinity, hi = -Infinity;
      const val = P.blocks.map(b => { const v = parseFloat(b.attrs && b.attrs[col]); if (isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); return v; } return null; });
      val.forEach((v, b) => { if (v != null) { const c = U.ramp(hi > lo ? (v - lo) / (hi - lo) : 0.5); cellColor[b] = [c[0], c[1], c[2], 175]; } });
      legend = { type: 'ramp', title: col, lo: isFinite(lo) ? U.fmtNum(lo, Math.abs(lo) < 100 ? 2 : 0) : '', hi: isFinite(hi) ? U.fmtNum(hi, Math.abs(hi) < 100 ? 2 : 0) : '' };
    } else if (mode === 'thick' && ws.cut) {

      if (l >= 0) for (let b = 0; b < ws.blockCells.length; b++) {
        const v = C.thick[b][l]; if (!(v === v)) continue;
        if (C.vol[b][l] > 1e-3) { nCut++; cellColor[b] = C.vol[b][l] > C.rawVol[b][l] - 1e-6 ? [227, 73, 72, 190] : [240, 160, 60, 185]; continue; }

        extra: nCut ? [['#e34948', `Below the ${C.min[l]} m cut-off: waste`], ...(C.by === 'cell' ? [['#f0a03c', 'Partly below the cut-off']] : [])] : null };

  },

  // ---------- selection ----------
  onViewClick(hit) {
    if (!hit) return;
    if (this.tab === 'dumps' && this.P) {
      const d = this.P.dumps.find(d => d.pts && d.pts.length > 2 && Geo.pip(hit.x, hit.y, d.pts));
      if (d) { this.dumpId = d.id; UI.renderTab(); this.refreshOverlays(); return; }
    }

      let best = null, bd = Infinity;
      for (const r of this.P.roads) { if (!r.pts || r.pts.length < 2) continue; const n = Geo.nearestOnLine(hit.x, hit.y, r.pts); if (n.d < bd) { bd = n.d; best = r; } }
      if (best && bd < Math.max(20, (best.width || 20))) { this.roadId = best.id; UI.renderTab(); this.refreshOverlays(); return; }

  // ---------- copies and memory ----------
  /* Copy a project with all its data under a new name; returns the id of the copy. */
  async copyProject(id, name) {
    const cur = !!this.P && id === this.P.id;
    if (cur && this.canEdit) { clearTimeout(this.saveTimer); if (this.persisted) await this.saveNow(); }
    const src = cur ? this.P : await this.store.load(id);
    if (!src) throw new Error('the project was not found');
    const Q = JSON.parse(JSON.stringify(src));
    Q.id = U.uid('prj'); Q.name = name; Q.isDemo = false; Q.created = new Date().toISOString();
    await this.store.save(Q);
    for (const k of ['grid', 'sat']) {
      let b = await this.store.getBlob(id, k);
      if (!b && k === 'grid' && cur && this.surf) b = Store.packSurfaces(this.surf); // an example that was never saved: its model is only in memory
      if (b) await this.store.putBlob(Q.id, k, b);
    }
    return Q.id;
  },
  /* Size of the last simulation in memory, in bytes (the arrays that hold the day-by-day changes and the daily figures). */
  resultBytes() {
    const r = this.res; let n = 0;
    const add = v => { if (v && v.byteLength) n += v.byteLength; };
    if (r) {
      for (const k of ['dCell', 'dIns', 'dFill', 'dayStart', 'working', 'voidDaily', 'rampDaily', 'rampFillDaily', 'rampFromWaste', 'rampCoalT', 'rampTDaily']) add(r[k]);
      for (const A of r.acts) for (const k of ['bcm', 't', 'hrs', 'excCap', 'trkCap', 'dozBcm', 'dozHrs', 'tsHrs']) add(A[k]);
      for (const D of r.dumps) add(D.daily);
      n += (r.records ? r.records.length : 0) * 56 + (r.bl ? r.bl.length * (r.bl[0] ? r.bl[0].length : 0) * 96 : 0) + (r.vol0 ? r.vol0.length * (r.vol0[0] ? r.vol0[0].length : 0) * 8 : 0);
    }
    if (this.pb) { add(this.pb.insitu); add(this.pb.fill); }
    return n;
  },
  /* Clear memory: drop the last simulation and everything worked out from it (results, playback, cached zones and
     routes), and rebuild the working model from the saved inputs. Nothing the user typed, drew or loaded is lost. */
  clearMemory(opts = {}) {
    if (!this.P) return 0;
    const had = !!this.res, bytes = this.resultBytes();
    Timeline.pause();
    View.cancelDraw(true);
    this.res = null; this.pb = null; this.day = -1; this.stale = false; this.lastValidation = null;
    if (this.ws) { const cam = true; this.buildWs({ keepCamera: cam }); Section.apply(); }
    Timeline.setData(null, this.P);
    UI.renderTab(); UI.renderInspector(); UI.renderLegend(); UI.renderColorBy();
    if (!opts.quiet) UI.toast(had ? `Memory cleared: the last simulation (about ${bytes >= 1048576 ? (bytes / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(bytes / 1024)) + ' kB'}) is released. Your model and inputs are unchanged — run the simulation when you are ready.` : 'Memory cleared. There were no simulation results to release; the model was rebuilt from your inputs.');
    return bytes;
  },

  // ---------- simulation ----------
  async runSim(opts = {}) {
    if (!this.ws) { UI.toast('Load elevation rasters and a block layout first (Data tab).'); return; }
    View.cancelDraw(true);
    const errs = Sim.validate(this.ws).filter(e => e.type === 'error');
    if (errs.length) { if (!opts.quiet) UI.toast(errs[0].msg); this.tab !== 'results' && !opts.quiet && UI.showTab('results'); this.lastValidation = errs; UI.renderTab(); return; }
    UI.busy('Simulating the mining schedule…', 0);
    await U.nextFrame();
    const t0 = performance.now();
    const est = Math.max(200, this.P.activities.reduce((s, a) => Math.max(s, a.path.length), 0) * 4);
    const keepDay = this.day;
    if (this.res) { Timeline.pause(); this.res = null; this.pb = null; Timeline.setData(null, this.P); this.day = keepDay; } // the old schedule is released first, so two are never held at once
    const res = await Sim.run(this.ws, { onProgress: (d) => UI.busy(`Simulating day ${d.toLocaleString('en-ZA')} — ${U.fmtDay(this.P.startDate, d)}`, Math.min(0.95, d / est)) });
    UI.busy(null);
    if (res.error) { this.clearMemory({ quiet: true }); UI.toast(res.error); return; }
    this.res = res; this.stale = false; this.lastValidation = null;
    this.pb = Sim.playback(this.ws, res);
    Timeline.setData(res, this.P);
    let target = res.nDays - 1;
    if (opts.seekTo === 'auto') {
      const today = U.daysBetween(this.P.startDate, U.todayISO());
      target = today > 0 && today < res.nDays ? today : Math.round(res.nDays * 0.38);
    } else if (typeof opts.seekTo === 'number') target = opts.seekTo;
    else if (this.day >= 0) target = Math.min(this.day, res.nDays - 1);
    this.seek(target);
    UI.renderTab(); UI.renderColorBy();
    if (!opts.quiet) UI.toast(`Simulated ${U.fmtNum(res.nDays)} days in ${((performance.now() - t0) / 1000).toFixed(1)} s — schedule ends ${U.fmtDay(this.P.startDate, res.nDays - 1)}.`);
  },
  seek(day) {
    if (!this.res || !this.pb) return;
    day = U.clamp(Math.round(day), -1, this.res.nDays - 1);
    this.day = day;
    this.pb.seek(day);
    View.setSurface(this.pb.insitu, this.pb.fill);
    Timeline.setDay(day);
    if (Section.active) Section.schedule();
    if (this.colorBy === 'status') this.refreshTint();
    this.refreshToes();
    Tabs.live();
    UI.renderInspectorThrottled();
  },
  // label the toe of each moving ramp at the timeline date
  refreshToes() {
    const out = [], res = this.res, P = this.P;
    if (res && res.rampToe && P && this.ws) for (const T of res.rampToe) {
      const r = P.roads.find(x => x.id === T.id); if (!r) continue;
      let st = null; for (const q of T.log) if (q.day <= this.day) st = q;
      if (st) { const p = Geo.pointAt(r.pts, st.a); out.push({ x: p[0], y: p[1], text: 'Ramp toe' }); }
    }
    View.setToes(out);
  },

  // ---------- satellite ----------
  satSignature() { const im = this.P.imagery || {}; return [this.P.id, this.P.gridVersion, im.provider, im.googleKey, im.customUrl, im.fileName, JSON.stringify(this.P.crs), this.P.grid && this.P.grid.cell].join('|'); },
  async toggleSat(force) {
    if (!this.ws) return;
    const want = force != null ? force : !this.sat.on;
    if (!want) { this.sat.on = false; View.setSatVisible(false); UI.setSatButton(false); return; }
    const sig = this.satSignature();
    if (!this.sat.canvas || this.sat.sig !== sig) {
      try { await this.loadSat(sig); }
      catch (e) { UI.setSatButton(false); UI.satMessage(e); return; }
    }
    this.sat.on = true;
    View.setSatVisible(true, (this.P.imagery && this.P.imagery.opacity) || 1);
    UI.setSatButton(true);
    UI.satMessage(null);
  },
  async loadSat(sig) {
    const im = this.P.imagery || {};
    let out;
    if (im.provider === 'file') {
      const u8 = await this.store.getBlob(this.P.id, 'sat');
      if (!u8) throw new Error('No imagery file loaded yet. Pick an image in the Data tab.');
      out = { canvas: await Imagery.jpegToCanvas(u8), attribution: im.fileName || 'Project image' };
    } else {
      UI.busy('Loading satellite imagery…', 0.05);
      try { out = await Imagery.fromTiles(this.ws, this.P, (t, f) => UI.busy(t, f)); }
      finally { UI.busy(null); }
    }
    this.sat.canvas = out.canvas; this.sat.sig = sig; this.sat.attribution = out.attribution;
    View.setSatTexture(out.canvas);
    UI.setAttribution(out.attribution);
  },

  bundle() { return Store.exportBundle(this.store, this.P, this.surf ? { grid: Store.packSurfaces(this.surf) } : {}); },
  /* Bring the activities in line with the pits (see Model.syncPits) and say what changed. */
  syncPits(quiet) {
    if (!this.P || !this.ws) return null;
    const r = Model.syncPits(this.P, this.ws);
    if (!this.P.activities.some(a => a.id === this.actId)) this.actId = this.P.activities[0] ? this.P.activities[0].id : null;
    if (this.pitId && !(this.P.pits || []).some(z => z.id === this.pitId)) this.pitId = null;
    if (!quiet && (r.created.length || r.removed.length || r.merged.length || r.moved)) {
      const parts = [];
      if (r.created.length) parts.push(`${r.created.length} activit${r.created.length === 1 ? 'y' : 'ies'} added`);
      if (r.moved) parts.push(`${r.moved} path block${r.moved === 1 ? '' : 's'} moved to the activities of their pit`);
      if (r.merged.length) parts.push(`${r.merged.length} activit${r.merged.length === 1 ? 'y' : 'ies'} joined again`);
      if (r.removed.length) parts.push(`${r.removed.length} activit${r.removed.length === 1 ? 'y' : 'ies'} without blocks removed`);
      UI.toast('Pits: ' + parts.join(', ') + '.', 7000);
    }
    return r;
  },
  fleetUnassign(actId) { this.P.fleet.forEach(e => { if (e.activityId === actId) e.activityId = ''; }); },

  // ---------- files ----------
  async saveFile(name, data) {
    if (this.env.artifact && window.claude) {
      const dl = await window.claude.use('downloads');
      if (!dl) { UI.toast('Downloads are not available in this view.'); return false; }
      try { await dl.save({ filename: name, data: data instanceof Uint8Array ? new Blob([data]) : data }); return true; }
      catch (e) { if (e && e.code !== 'declined') UI.toast('The file could not be saved (' + (e.code || e.message) + ').'); return false; }
    }
    const blob = data instanceof Blob ? data : new Blob([data]);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  },
  async exportExcel() {
    if (!this.ws) { UI.toast('There is no model to report yet.'); return; }
    if (typeof XLSX === 'undefined') { UI.toast('The Excel library did not load. Check your internet connection and reload.'); return; }
    if (!this.res) { UI.toast('Run the simulation first so the report has dates.'); return; }
    UI.busy('Building the Excel schedule…', 0.4); await U.nextFrame();
    try {
      const bytes = Report.toBytes(Report.build(this));
      UI.busy(null);
      const nm = U.slug(this.P.name) || 'schedule';
      await this.saveFile(`${nm}_schedule_${U.toISO(U.parseISO(U.todayISO())).replace(/-/g, '')}.xlsx`, bytes);
    } catch (e) { UI.busy(null); UI.toast('Report failed: ' + e.message); }
  }
};

function migrate(P) {
  P.calendar = Object.assign({ hoursPerDay: 22, workDays: [1, 1, 1, 1, 1, 1, 1], saHolidays: false, maxYears: 30 }, P.calendar || {});
  P.imagery = Object.assign({ provider: 'google', googleKey: '', customUrl: '', fileName: '', opacity: 1 }, P.imagery || {});
  P.view = Object.assign({ vex: 3 }, P.view || {});
  P.source = P.source || {};
  for (const k of ['surfaces', 'layers', 'blocks', 'activities', 'fleet', 'roads', 'dumps', 'attrColumns', 'overlays', 'limits', 'pits']) P[k] = P[k] || [];
  P.crs = P.crs || { preset: 'lo29_neg', proj4: '', axis: 'EN' };
  P.cutoff = Object.assign({ by: 'block', stop: false }, P.cutoff || {});
  P.targets = Object.assign({ coal: null, waste: null, wasteUnit: 'bcm', basis: 'calendar', mode: 'limit' }, P.targets || {});
  P.voidTip = Object.assign({ on: true, ref: 'top', afterStrips: 2, roads: true, dozeAfterStrips: 0 }, P.voidTip || {});
  P.attrReport = P.attrReport || {};
  // dump options with start dates replace the plain priority list
  for (const a of P.activities) { if (!Array.isArray(a.dests)) a.dests = Model.actDests(a); delete a.dumps; }
}

function startApp() {
  if (typeof THREE === 'undefined' || !THREE.OrbitControls) {
    document.getElementById('viewport').innerHTML = '<div class="empty" style="margin:40px;color:#fff;border-color:#fff4">The 3D library could not be loaded. Check your internet connection and reload the page.</div>';
    return;
  }
  App.boot().catch(e => { console.error(e); UI.toast('Start-up failed: ' + e.message); });
}
if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', startApp); else startApp();

</script>
